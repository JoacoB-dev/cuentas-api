# nginx dentro del contenedor "web": sirve el build de Angular y redirige /api a la API.
# Como el navegador ve un solo origen (localhost:4201), no hace falta CORS.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cabeceras de seguridad básicas.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API REST, Swagger UI y health del backend.
    location ^~ /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
    location ~ ^/(swagger-ui|v3/api-docs|swagger-ui\.html) {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    # Ojo: no se usa add_header dentro de los location, porque en nginx eso
    # reemplaza (no suma) las cabeceras de seguridad definidas arriba.
    # "expires" pone Cache-Control sin pisarlas.

    # Archivos con hash en el nombre: se pueden cachear por mucho tiempo.
    location ~* \.(?:js|css|woff2?|ico|png|svg)$ {
        expires 1y;
        try_files $uri =404;
    }

    # Rutas de Angular (/cuentas, /transferir...): siempre index.html, sin caché.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
