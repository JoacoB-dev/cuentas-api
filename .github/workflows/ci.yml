# CI de cuentas-api (github.com/JoacoB-dev/cuentas-api).
# - backend: tests unitarios + integración contra PostgreSQL y Redis reales (servicios del job).
# - frontend: lint, tests unitarios y build de producción de Angular.
# - docker: build de las dos imágenes (API y web).
# - e2e: levanta todo con Docker Compose y corre el recorrido de Playwright en Chromium.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Si llega otro push a la misma rama, se cancela la corrida anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (mvn verify)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cuentas_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Tests (unitarios + integración contra PostgreSQL y Redis)
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/cuentas_test
          TEST_DB_USER: postgres
          TEST_DB_PASSWORD: postgres
          TEST_REDIS_HOST: localhost
          TEST_REDIS_PORT: '6379'
        run: mvn -B verify
      - name: Reportes de tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-backend
          path: target/surefire-reports/

  frontend:
    name: Frontend (lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    name: Imágenes Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build de la imagen de la API
        run: docker build -t cuentas-api:ci .
      - name: Build de la imagen web (nginx + Angular)
        run: docker build -t cuentas-web:ci web

  e2e:
    name: E2E (Docker Compose + Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      # Secreto sólo para esta corrida efímera de CI (no protege nada real).
      JWT_SECRET: secreto-de-ci-solo-para-el-e2e-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - name: Levantar Postgres + Redis + API + web
        run: docker compose up -d --build --wait
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Instalar dependencias y Chromium
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Playwright
        working-directory: web
        run: npx playwright test
      - name: Logs de los contenedores
        if: failure()
        run: docker compose logs --no-color
      - name: Reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-playwright
          path: web/playwright-report/
      - name: Bajar el stack
        if: always()
        run: docker compose down -v
