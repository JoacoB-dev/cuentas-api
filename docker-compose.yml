# Levanta PostgreSQL 16 + la API. Uso: copiar .env.example a .env, completar
# JWT_SECRET y correr "docker compose up --build".
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: cuentas
      POSTGRES_USER: cuentas
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cuentas}
    ports:
      - "5432:5432"
    volumes:
      - datos-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cuentas -d cuentas"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/cuentas
      DB_USER: cuentas
      DB_PASSWORD: ${DB_PASSWORD:-cuentas}
      JWT_SECRET: ${JWT_SECRET:?Definí JWT_SECRET (mínimo 32 caracteres) en el archivo .env}
      CARGAR_DATOS_DEMO: ${CARGAR_DATOS_DEMO:-true}
    ports:
      - "8080:8080"

volumes:
  datos-postgres:
